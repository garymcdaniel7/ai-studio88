# =============================================================================
# AI Studio CI Pipeline
# =============================================================================
# Comprehensive CI covering: Python linting, frontend linting + build,
# unit tests, integration tests, security scanning, and secret detection.
#
# All jobs are merge-blocking. PRs cannot merge with any failure.
#
# Requirements: R7.3, R73.4 (Production Deployment Pipeline, CI/CD)
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  UV_VERSION: "0.5.0"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # PYTHON LINT: Ruff check + format verification
  # ═══════════════════════════════════════════════════════════════════════════════
  lint-python:
    name: "Python: Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-lint-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            uv-lint-${{ runner.os }}-

      - name: Install linters
        run: uv pip install --system ruff

      - name: Ruff lint check
        run: ruff check backend/ --exit-non-zero-on-fix

      - name: Ruff format check
        run: ruff format --check backend/

  # ═══════════════════════════════════════════════════════════════════════════════
  # FRONTEND LINT: ESLint + TypeScript compilation check
  # ═══════════════════════════════════════════════════════════════════════════════
  lint-frontend:
    name: "Frontend: Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript compilation check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: ESLint
        run: npx next lint
        working-directory: frontend

  # ═══════════════════════════════════════════════════════════════════════════════
  # UNIT TESTS: pytest (no DB, no external services)
  # ═══════════════════════════════════════════════════════════════════════════════
  test-unit:
    name: "Backend: Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-test-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            uv-test-${{ runner.os }}-

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -e ".[dev]"

      - name: Run unit tests with coverage
        env:
          AUTH_DEV_MODE: "true"
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: |
          python -m pytest tests/unit/ -v \
            --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -x

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════
  # INTEGRATION TESTS: pytest (requires Supabase, run if secrets available)
  # ═══════════════════════════════════════════════════════════════════════════════
  test-integration:
    name: "Backend: Integration Tests"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-test-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            uv-test-${{ runner.os }}-

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -e ".[dev]"

      - name: Run integration tests
        if: env.SUPABASE_URL != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_DEV_MODE: "true"
        run: |
          python -m pytest tests/integration/ -v \
            --tb=short \
            -x

      - name: Skip notice (no secrets)
        if: env.SUPABASE_URL == ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: echo "::notice::Integration tests skipped — SUPABASE_URL secret not configured"

  # ═══════════════════════════════════════════════════════════════════════════════
  # SECURITY AUDIT: pip-audit + Bandit static analysis
  # ═══════════════════════════════════════════════════════════════════════════════
  security-audit:
    name: "Security: Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: uv pip install --system pip-audit bandit

      - name: pip-audit (block on HIGH/CRITICAL vulnerabilities)
        run: |
          pip-audit --desc || {
            echo "::error::Vulnerabilities found. Run 'pip-audit' locally to review."
            exit 1
          }

      - name: Bandit static analysis (block on HIGH confidence findings)
        run: |
          bandit -r backend/ -ll -ii \
            --severity-level high \
            --confidence-level high \
            -q || {
            echo "::error::Bandit found high-severity, high-confidence issues."
            exit 1
          }

  # ═══════════════════════════════════════════════════════════════════════════════
  # FRONTEND BUILD: Next.js production build (catches build errors)
  # ═══════════════════════════════════════════════════════════════════════════════
  frontend-build:
    name: "Frontend: Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key-for-build"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build
        working-directory: frontend

  # ═══════════════════════════════════════════════════════════════════════════════
  # SECRET SCAN: Gitleaks (tree + history)
  # ═══════════════════════════════════════════════════════════════════════════════
  secret-scan:
    name: "Security: Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --config=.gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ═══════════════════════════════════════════════════════════════════════════════
  # GATE: All checks must pass before merge
  # ═══════════════════════════════════════════════════════════════════════════════
  ci-gate:
    name: "CI Gate"
    runs-on: ubuntu-latest
    needs:
      - lint-python
      - lint-frontend
      - test-unit
      - security-audit
      - frontend-build
      - secret-scan
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          echo "lint-python: ${{ needs.lint-python.result }}"
          echo "lint-frontend: ${{ needs.lint-frontend.result }}"
          echo "test-unit: ${{ needs.test-unit.result }}"
          echo "security-audit: ${{ needs.security-audit.result }}"
          echo "frontend-build: ${{ needs.frontend-build.result }}"
          echo "secret-scan: ${{ needs.secret-scan.result }}"

          if [ "${{ needs.lint-python.result }}" != "success" ] || \
             [ "${{ needs.lint-frontend.result }}" != "success" ] || \
             [ "${{ needs.test-unit.result }}" != "success" ] || \
             [ "${{ needs.security-audit.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ] || \
             [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "::error::One or more required CI jobs failed. Merge blocked."
            exit 1
          fi

          echo "All required CI checks passed."
