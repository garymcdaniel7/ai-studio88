openapi: "3.1.0"
info:
  title: AI Studio Gen API
  version: "0.1.0"
  description: |
    Standalone generation service — dispatches image/video/LoRA training jobs
    to GPU workers. Inherits auth from the parent AI Studio backend gateway;
    no auth scheme is defined here. All endpoints require a valid Bearer token
    in the Authorization header, validated upstream.

servers:
  - url: "http://localhost:8001"
    description: Local dev (docker compose)
  - url: "https://gen-api.ai-studio88.com"
    description: Production (Thunder or RunPod)
  - url: "https://gen-api-staging.ai-studio88.com"
    description: Staging

paths:
  /health:
    get:
      summary: Worker fleet health
      operationId: getHealth
      responses:
        "200":
          description: Health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                workers:
                  - name: thunder-a6000-1
                    model: h3
                    status: idle
                    queue_depth: 0
                    memory_used_gb: 14.2
                    uptime_hours: 47.3
                  - name: thunder-a6000-2
                    model: wan
                    status: running
                    current_job: "job_abc123"
                    queue_depth: 2
                    memory_used_gb: 38.1
                    uptime_hours: 12.8

  /api/gen/backends:
    get:
      summary: List available generation backends and their capabilities
      operationId: listBackends
      responses:
        "200":
          description: Backend capability map
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/BackendCapability"
              example:
                h3:
                  models: ["minimax-h3-fl2va", "minimax-h3-ref2va", "minimax-h3-sparse-ref15"]
                  max_resolution: "1536x768"
                  supports_i2v: true
                  supports_r2v: true
                  supports_motion_director: true
                  max_frames: 277
                  turbo_available: true
                wan:
                  models: ["wan-2.2-14b-remix"]
                  max_resolution: "832x480"
                  supports_i2v: false
                  supports_lora: true
                  lightning_lora_supported: true
                klein:
                  models: ["flux-2-klein-9b-fp8"]
                  max_resolution: "1024x1024"
                  supports_i2v: false
                  supports_img2img: true
                  supports_lora: true
                krea:
                  models: ["krea-2-nsfw"]
                  max_resolution: "1024x1024"
                  supports_identity_edit: true
                  trigger_word: "CBUNCT"
                lora:
                  models: ["musubi-tuner"]
                  supports_training: true
                  max_dataset_images: 40

  /api/gen/jobs:
    post:
      summary: Submit a generation job
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "201":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
          headers:
            Location:
              schema:
                type: string
              description: URL to poll job status
              example: "/api/gen/jobs/job_abc123"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No worker available for requested backend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: List jobs with optional filters
      operationId: listJobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, completed, failed, cancelled]
          description: Filter by job status
        - name: backend
          in: query
          schema:
            type: string
          description: Filter by backend type
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Max results
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Pagination offset
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/JobStatus"

  /api/gen/jobs/{job_id}:
    get:
      summary: Get job status and result
      operationId: getJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^job_[a-zA-Z0-9]+$"
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "404":
          description: Job not found

    delete:
      summary: Cancel a queued or running job
      operationId: cancelJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [cancelled]
        "409":
          description: Job already completed; cannot cancel

  /api/gen/jobs/{job_id}/output:
    get:
      summary: Download job output artifact(s)
      operationId: getJobOutput
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
        - name: file
          in: query
          schema:
            type: string
          description: Specific file name (returns a zip of all outputs if omitted)
      responses:
        "200":
          description: File or zip download
          content:
            application/zip:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Output not found or job not completed

  /api/gen/webhooks:
    post:
      summary: Register or update a webhook URL for async job completion
      operationId: registerWebhook
      requestBody:
        required: true
        content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: Webhook URL called on job completion/failure
                  events:
                    type: array
                    items:
                      type: string
                      enum: [completed, failed]
                    default: ["completed"]
                    description: Which events trigger the webhook
      responses:
        "200":
          description: Webhook registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]

    delete:
      summary: Remove webhook registration
      operationId: deleteWebhook
      requestBody:
        required: true
        content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
      responses:
        "200":
          description: Webhook removed

  /api/gen/workers/{worker_id}/drain:
    post:
      summary: Signal a worker to stop accepting new jobs (graceful shutdown)
      operationId: drainWorker
      parameters:
        - name: worker_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Worker draining. Finishes current job, stops polling.

components:
  schemas:
    JobRequest:
      type: object
      required: [backend, workload]
      properties:
        backend:
          type: string
          enum: [h3, wan, klein, krea, lora]
          description: Which generation backend to use
        org_id:
          type: string
          format: uuid
          description: Tenant org ID for scoping. Defaults to caller's org from auth token.
        webhook_url:
          type: string
          format: uri
          description: |
            Optional. If provided, the gen service POSTs the JobStatus payload
            to this URL on completion or failure. Enables async delivery so
            the frontend doesn't need to poll.
        workload:
          $ref: "#/components/schemas/Workload"

    Workload:
      type: object
      oneOf:
        - $ref: "#/components/schemas/ImageWorkload"
        - $ref: "#/components/schemas/VideoWorkload"
        - $ref: "#/components/schemas/LoRATrainingWorkload"
      discriminator:
        propertyName: type
        mapping:
          image: "#/components/schemas/ImageWorkload"
          video: "#/components/schemas/VideoWorkload"
          lora_train: "#/components/schemas/LoRATrainingWorkload"

    ImageWorkload:
      type: object
      required: [type, model, prompt]
      properties:
        type:
          type: string
          enum: [image]
        model:
          type: string
          description: Model ID from the backend's capability list
        prompt:
          type: string
        negative_prompt:
          type: string
        width:
          type: integer
          default: 768
        height:
          type: integer
          default: 768
        steps:
          type: integer
          default: 12
        cfg:
          type: number
          default: 1.0
        seed:
          type: integer
        lora:
          type: array
          items:
            $ref: "#/components/schemas/LoRAReference"
        image_refs:
          type: array
          items:
            type: string
            format: uri
          description: |
            Reference image URLs for img2img / Identity Edit.
            The gen service downloads these to the worker's local storage.
        denoise:
          type: number
          description: Denoise strength for img2img (0.0-1.0). Default 0.45 for identity-critical faces.
        trigger_word:
          type: string
          description: Model-specific trigger (e.g. "CBUNCT" for Krea 2)

    VideoWorkload:
      type: object
      required: [type, model, prompt]
      properties:
        type:
          type: string
          enum: [video]
        model:
          type: string
        prompt:
          type: string
        width:
          type: integer
          default: 768
        height:
          type: integer
          default: 768
        steps:
          type: integer
          default: 8
        cfg:
          type: number
          default: 1.0
        shift_video:
          type: number
          default: 1.0
          description: Sigma shift for video. 1.0 for turbo, 6.0 for full FL2VA.
        shift_audio:
          type: number
          default: 1.0
        seed:
          type: integer
        frame_count:
          type: integer
          description: Must be on 17k+5 grid (226/243/260/277 for 15s@24fps)
        turbo:
          type: boolean
          default: false
          description: Use LightX2V Turbo LoRA for 4-step generation
        lora:
          type: array
          items:
            $ref: "#/components/schemas/LoRAReference"
        image_refs:
          type: array
          items:
            type: string
            format: uri
          description: |
            Reference images for I2V or Ref2VA. First image is the primary anchor.
        image_refs_weights:
          type: array
          items:
            type: number
          description: Per-reference weights for multi-reference identity lock (R2V / SparseRef15)
        motion_director:
          type: object
          properties:
            segments:
              type: array
              items:
                $ref: "#/components/schemas/MotionSegment"
          description: Multi-shot timeline. Chain of segment prompts after the first.
        negative_prompt:
          type: string
          default: "bad hands, extra fingers, ghosting, morphing, clothes appearing, camera movement, subject turning, two penises"

    MotionSegment:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          description: Multi-modal prompt for this segment
        frame_count:
          type: integer
          default: 226
        seed_offset:
          type: integer
          default: 0
          description: Per-segment seed offset for deterministic chaining

    LoRATrainingWorkload:
      type: object
      required: [type, model, dataset_images_urls]
      properties:
        type:
          type: string
          enum: [lora_train]
        model:
          type: string
          enum: [musubi-tuner]
          description: Only Musubi Tuner on Krea 2 Raw is supported
        dataset_images_urls:
          type: array
          items:
            type: string
            format: uri
          minItems: 20
          maxItems: 40
          description: URLs of clean, consistent reference images for training
        trigger_word:
          type: string
          description: All-caps trigger word for the LoRA (e.g. "CHARACTER_NAME")
        rank:
          type: integer
          default: 16
        alpha:
          type: integer
          default: 16
        learning_rate:
          type: number
          default: 0.0001
        resolution:
          type: integer
          default: 1024
        lora_name:
          type: string
          description: Desired name for the output LoRA file
        base_model:
          type: string
          default: "krea-2-raw"
          description: Base model to train on (NOT convrot/Turbo — must be raw)

    LoRAReference:
      type: object
      properties:
        name:
          type: string
          description: LoRA filename or identifier
        strength:
          type: number
          default: 1.0
          description: LoRA weight (0.0-1.0). Max 0.75 for Klein's CoachBate penis LoRA.
        trigger:
          type: string
          description: Trigger word from the LoRA, if applicable

    JobResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued]
        created_at:
          type: string
          format: date-time
        estimated_seconds:
          type: integer
          description: Estimated time to completion based on current queue depth

    JobStatus:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        backend:
          type: string
        worker_id:
          type: string
        progress:
          type: integer
          description: Percentage 0-100
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        result:
          type: object
          properties:
            storage:
              type: string
              description: |
                Storage backend identifier (e.g. "local:/output", "s3://ai-studio-gen-outputs")
              example: "local:/output"
            files:
              type: array
              items:
                type: object
                properties:
                  filename:
                    type: string
                  path:
                    type: string
                  size_bytes:
                    type: integer
                  mime_type:
                    type: string
            output_url:
              type: string
              format: uri
              description: URL to fetch output via /api/gen/jobs/{id}/output
            metadata:
              type: object
              properties:
                seed:
                  type: integer
                steps:
                  type: integer
                model:
                  type: string
                prompt:
                  type: string
                resolution:
                  type: string
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        attempts:
          type: integer
          default: 1
          description: Retry count on transient failure

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        workers:
          type: array
          items:
            $ref: "#/components/schemas/WorkerHealth"

    WorkerHealth:
      type: object
      properties:
        name:
          type: string
        model:
          type: string
        status:
          type: string
          enum: [idle, running, draining, offline]
        current_job:
          type: string
        queue_depth:
          type: integer
        memory_used_gb:
          type: number
        uptime_hours:
          type: number
        gpu_util_percent:
          type: number

    BackendCapability:
      type: object
      properties:
        models:
          type: array
          items:
            type: string
        max_resolution:
          type: string
        supports_i2v:
          type: boolean
        supports_r2v:
          type: boolean
        supports_motion_director:
          type: boolean
        supports_img2img:
          type: boolean
        supports_lora:
          type: boolean
        supports_identity_edit:
          type: boolean
        max_frames:
          type: integer
        turbo_available:
          type: boolean
        max_dataset_images:
          type: integer
        trigger_word:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            detail:
              type: string